<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>José María Candalija — Concept Artist</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, Helvetica, sans-serif;
            background: #111111;
            color: #ffffff;
        }

        .card {
            width: 90%;
            max-width: 500px;
            padding: 50px 30px;
            text-align: center;
            background: #1b1b1b;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.5);
        }

        h1 {
            margin: 0 0 15px;
            font-size: 32px;
        }

        .profession {
            margin-bottom: 35px;
            color: #bbbbbb;
            font-size: 17px;
            line-height: 1.5;
        }

        .button {
            display: block;
            margin: 15px 0;
            padding: 15px;
            border-radius: 10px;
            background: #ffffff;
            color: #f51f46;
            text-decoration: none;
            font-weight: bold;
            transition: 0.2s;
        }

        .button:hover {
            background: #dddddd;
            transform: translateY(-2px);
        }

        .email {
            margin-top: 25px;
            color: #aaaaaa;
            font-size: 14px;
        }
    </style>
</head>

<body>

  <div class="card">

<img src="cromajoma.com_FAVICON_POSITIVO_ROJO_RE_PEQUEÑO.png"
     alt="Logo de José María Candalija"
     style="width:120px;height:120px;object-fit:contain;margin-bottom:20px;">

<h1>José María Candalija</h1>

        <a class="button"
           href="https://www.artstation.com/josemariacandalija"

           target="_blank">
            LINKEDIN
        </a>
